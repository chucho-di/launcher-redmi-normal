name: Build APK Launcher Real
on: [push]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install system deps
        run: |
          sudo apt update
          sudo apt install -y openjdk-17-jdk python3-pip zip unzip libncurses6 libtinfo6 libffi-dev libssl-dev libbz2-dev
          pip install --upgrade pip buildozer Cython virtualenv
      - name: Build APK
        run: |
          buildozer android debug
      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: APK-Launcher-Redmi-Normal
          path: bin/*.apk
      - name: Upload logs if failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: .buildozer/logs/